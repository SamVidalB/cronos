<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capacitaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto max-w-5xl px-4 py-12">
    <header class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">
        Formación
      </p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">
        Capacitaciones
      </h1>
      <p class="mt-3 text-slate-600">
        Explora las capacitaciones disponibles.
      </p>
    </header>

    <section class="mb-6">
      <label for="busqueda" class="sr-only">Buscar capacitaciones</label>
      <input
        id="busqueda"
        type="search"
        placeholder="Buscar por título o descripción…"
        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 shadow-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </section>

    <p id="estado" role="status" class="mb-4 text-sm text-slate-600">
      Cargando capacitaciones…
    </p>

    <section
      id="lista"
      aria-label="Lista de capacitaciones"
      class="grid gap-5 sm:grid-cols-2"
    ></section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://jvzpieusavmfsxsouufh.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-IAGNWF4joz-76nU4yjMNg_2aAoo5_2";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const lista = document.querySelector("#lista");
    const estado = document.querySelector("#estado");
    const busqueda = document.querySelector("#busqueda");

    let capacitaciones = [];

    function crearTarjeta(capacitacion) {
      const tarjeta = document.createElement("article");
      tarjeta.className =
        "rounded-2xl border border-slate-200 bg-white p-6 shadow-sm";

      const titulo = document.createElement("h2");
      titulo.className = "text-lg font-semibold text-slate-900";
      titulo.textContent = capacitacion.titulo || "Sin título";

      const descripcion = document.createElement("p");
      descripcion.className = "mt-3 whitespace-pre-line leading-6 text-slate-600";
      descripcion.textContent =
        capacitacion.descripcion || "No hay descripción disponible.";

      tarjeta.append(titulo, descripcion);

      if (capacitacion.created_at) {
        const fecha = document.createElement("p");
        fecha.className = "mt-5 text-xs text-slate-400";
        fecha.textContent = `Agregada: ${new Date(
          capacitacion.created_at
        ).toLocaleDateString("es", {
          year: "numeric",
          month: "long",
          day: "numeric",
        })}`;
        tarjeta.append(fecha);
      }

      return tarjeta;
    }

    function mostrarCapacitaciones() {
      const termino = busqueda.value.trim().toLocaleLowerCase("es");
      const filtradas = capacitaciones.filter((item) =>
        `${item.titulo ?? ""} ${item.descripcion ?? ""}`
          .toLocaleLowerCase("es")
          .includes(termino)
      );

      lista.replaceChildren(...filtradas.map(crearTarjeta));

      estado.textContent = filtradas.length
        ? `${filtradas.length} capacitación${filtradas.length === 1 ? "" : "es"}`
        : "No se encontraron capacitaciones.";
    }

    async function cargarCapacitaciones() {
      const { data, error } = await supabase
        .from("capacitaciones")
        .select("id, titulo, descripcion, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Error al cargar capacitaciones:", error);
        estado.textContent =
          "No se pudieron cargar los datos. Revisa la clave, los permisos de la API y las políticas RLS.";
        return;
      }

      capacitaciones = data ?? [];
      mostrarCapacitaciones();
    }

    busqueda.addEventListener("input", mostrarCapacitaciones);
    cargarCapacitaciones();
  </script>
</body>
</html>
